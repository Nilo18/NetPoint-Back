<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 – Page Not Found | NetPoint</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../css/404.css">
</head>
<body>

<header>
    <div class="logo-icon">
        <svg viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="9"/>
            <polyline points="12 7 12 12 15 15"/>
        </svg>
    </div>
    <span class="logo-name">NetPoint</span>
</header>

<main class="hero">
    <div class="number-block">
        <div class="big-number">
            <span>4</span>
            <div class="zero-slot">
                <div class="zero-ring"></div>
                <div class="search-icon-wrap">
                </div>
            </div>
            <span>4</span>
        </div>
    </div>

    <h1>Page Not Found</h1>
    <p>The page you're looking for doesn't exist or has been moved. Let's get you back on track.</p>

    <div class="btn-group">
        <a href="/" class="btn btn-primary">
            <!-- Home icon -->
            <svg viewBox="0 0 24 24">
                <path d="M3 9.75L12 3l9 6.75V20a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V9.75z"/>
                <polyline points="9 22 9 12 15 12 15 22"/>
            </svg>
            Back to Home
        </a>
        <a href="javascript:history.back()" class="btn btn-secondary">
            <!-- Arrow left icon -->
            <svg viewBox="0 0 24 24">
                <line x1="19" y1="12" x2="5" y2="12"/>
                <polyline points="12 19 5 12 12 5"/>
            </svg>
            Go Back
        </a>
    </div>
</main>
