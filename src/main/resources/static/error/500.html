<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>500 – Server Error | NetPoint</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../css/500.css">
</head>
<body>

<header>
    <div class="logo-icon">
        <svg viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="9"/>
            <polyline points="12 7 12 12 15 15"/>
        </svg>
    </div>
    <span class="logo-name">NetPoint</span>
</header>

<main class="hero">
    <div class="number-block">
        <div class="big-number">
            <span>5</span>
            <div class="zero-slot">
                <div class="zero-ring"></div>
                <div class="warning-icon-wrap">
                    <!-- Warning triangle -->
                    <svg viewBox="0 0 24 24">
                        <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
                        <line x1="12" y1="9" x2="12" y2="13"/>
                        <line x1="12" y1="17" x2="12.01" y2="17"/>
                    </svg>
                </div>
            </div>
            <span>0</span>
        </div>
    </div>

    <h1>Server Error</h1>
    <p>Oops! Something went wrong on our end. Our team has been notified and we're working to fix it.</p>

    <div class="info-card">
        <div class="info-card-icon">
            <svg viewBox="0 0 24 24">
                <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
                <line x1="12" y1="9" x2="12" y2="13"/>
                <line x1="12" y1="17" x2="12.01" y2="17"/>
            </svg>
        </div>
        <div class="info-card-text">
            <h3>What happened?</h3>
            <p>The server encountered an unexpected condition that prevented it from fulfilling your request.</p>
        </div>
    </div>

    <div class="btn-group">
        <a href="javascript:location.reload()" class="btn btn-primary">
            <svg viewBox="0 0 24 24">
                <polyline points="23 4 23 10 17 10"/>
                <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
            </svg>
            Try Again
        </a>
        <a href="/" class="btn btn-secondary">
            <svg viewBox="0 0 24 24">
                <path d="M3 9.75L12 3l9 6.75V20a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V9.75z"/>
                <polyline points="9 22 9 12 15 12 15 22"/>
            </svg>
            Back to Home
        </a>
    </div>
</main>

</body>
</html>
